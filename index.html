var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

    if (d.storno || d.typ !== 'vydana' || d.dan_z_prijmu === false) continue;
    const S = d.soucty || {}, base = +S.zaklad || 0, tot = +S.celkem || 0, cizi = d.mena && d.mena !== 'CZK';
    if ((d.duzp || '').slice(0, 4) === y) duzp += +S.zaklad_czk || 0;

function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type || 'application/octet-stream'})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

  let ico = digits(q); const [cc, v] = splitVat(q); if (cc === 'CZ') ico = v;
  if (ico.length !== 8) throw new Error('Zadej IČO (8 číslic) nebo DIČ ve tvaru CZ + IČO. Podle DIČ fyzické osoby ARES hledat neumí.');
  const r = await fetch('https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ekonomicke-subjekty/' + ico, {headers: {Accept: 'application/json'}});
  if (r.status === 404) throw new Error('Subjekt s IČO ' + ico + ' v ARES není.');
  if (!r.ok) throw new Error('ARES neodpověděl (' + r.status + ').');
  const j = await r.json(), s = j.sidlo || {}, cislo = [s.cisloDomovni, s.cisloOrientacni].filter(Boolean).join('/') + (s.cisloOrientacniPismeno || '');
  return {nazev: j.obchodniJmeno || '', ico: j.ico || ico, dic: j.dic || '', ulice: ((s.nazevUlice || s.nazevCastiObce || s.nazevObce || '') + ' ' + cislo).trim(),

A.ulozVydanou = async () => {

    const [cc] = splitVat(c.dic);

    if (F.rezim === 'tuzemsko' && cc && cc !== 'CZ') throw new Error('Tuzemský režim u zahraničního odběratele – zkontroluj režim DPH.');
    const kurz = F.mena === 'CZK' ? 1 : num(F.kurz); if (!kurz) throw new Error('U cizí měny vyplň kurz ČNB k DUZP.');

  const now = new Date(), ms = []; for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); ms.push({k: mesKey(d), l: MES[d.getMonth()].slice(0, 3), v: 0, u: 0}); }

  ${e.neuhr.length ? `<p class="muted">Neuhrazené faktury (do příjmů se počítají až po úhradě): ${e.neuhr.map(d => esc(d.cislo)).join(', ')}</p>` : ''}
  <h2>Přijaté úhrady ${dpRok}</h2><div class="card flat"><div class="tw"><table><thead><tr><th>Faktura</th><th>Odběratel</th><th>Uhrazeno</th><th class="r">Kurz</th><th class="r">Základ Kč</th></tr></thead><tbody>${e.radky.map(x => `<tr class="clk" onclick="go('vydana','${esc(x.cislo)}')"><td>${esc(x.cislo)}</td><td>${esc(x.partner)}</td><td>${fd(x.datum)}</td><td class="r">${x.kurz ? fmt(x.kurz, 3) + (x.odhad ? ' *' : '') : ''}</td><td class="r">${fmt(x.zaklad)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="4">Celkem${e.odhad ? ' (* kurz faktury, ne kurz ke dni úhrady)' : ''}</td><td class="r">${fmt(e.prijmy)}</td></tr></tfoot></table></div></div>`;
};
async function saveNast(patch) { const n = JSON.parse(JSON.stringify(Store.files['nastaveni.json'] || {})); for (const k in patch) n[k] = Object.assign({}, n[k] || {}, patch[k]); await save('nastaveni.json', n); }
A.ulozDan = async () => { const v = collect($('#dp')), dp = Store.nast().dan_prijmy, p = {};
  for (const k of ['rucne', 'zd8', 'zalohy_dan', 'zalohy_soc', 'zalohy_zdr']) { p[k] = Object.assign({}, dp[k] || {}); if (v[k] === '') delete p[k][dpRok]; else p[k][dpRok] = num(v[k]); }
  await saveNast({dan_prijmy: p}); toast('Uloženo.'); render(); };
A.danXml = () => download(`DPFDP7-${dpRok}.xml`, Dane.dpfdp7(dpRok), 'text/xml');
A.osvcXml = () => download(`OSVC-${dpRok}.xml`, Dane.osvc(dpRok), 'text/xml');
A.doplnKurzy = async rok => { let n = 0, chyb = 0; toast('Načítám kurzy ČNB…');
  for (const d of Store.docs()) { if (d.typ !== 'vydana' || d.storno || !d.mena || d.mena === 'CZK') continue; const us = (d.uhrady || []); if (!us.some(u => !u.kurz && (u.datum || '').startsWith(String(rok)))) continue;
    const nove = []; for (const u of us) { if (!u.kurz && (u.datum || '').startsWith(String(rok))) { try { nove.push(Object.assign({}, u, {kurz: await cnbKurz(d.mena, u.datum)})); n++; } catch (e) { nove.push(u); chyb++; } } else nove.push(u); }
    await novaVerze(d, {uhrady: nove}); }
  toast(`Doplněno ${n} kurzů${chyb ? ', ' + chyb + ' se nepodařilo načíst' : ''}.`, !!chyb); render(); };

/* ---------- nastavení ---------- */
V.nastaveni = () => {
  const f = Store.firma(), n = Store.nast(), u = f.ucty || {}, c = u.CZK || {}, e = u.EUR || {}, o = n.osoba, rok = new Date().getFullYear(), p = Dane.param(rok);
  return `<h1>Nastavení</h1>
  <div class="card" id="s-firma"><h3>Firma</h3><div class="grid">${fld('Název / jméno', 'nazev', f.nazev)}${fld('Ulice a číslo', 'ulice', f.ulice)}${fld('Město', 'mesto', f.mesto)}${fld('PSČ', 'psc', f.psc)}${fld('IČO', 'ico', f.ico)}${fld('DIČ', 'dic', f.dic)}${fld('E-mail', 'email', f.email)}${fld('Telefon', 'telefon', f.telefon)}${fld('Konstantní symbol', 'konstantni_symbol', f.konstantni_symbol)}</div>
  <h3>Bankovní účty</h3><div class="grid">${fld('Účet CZK', 'czk_cislo', c.cislo)}${fld('IBAN CZK', 'czk_iban', c.iban)}${fld('SWIFT CZK', 'czk_swift', c.swift)}${fld('Účet EUR', 'eur_cislo', e.cislo)}${fld('IBAN EUR', 'eur_iban', e.iban)}${fld('SWIFT EUR', 'eur_swift', e.swift)}</div>
  <div class="row"><button class="pri" onclick="A.ulozFirmu()">Uložit firmu a účty</button></div></div>
  <div class="card" id="s-nast"><h3>Číselné řady</h3><p class="muted">RRRR = rok, RR = rok dvoumístně, MM = měsíc, NNN = pořadí v roce (počet N = počet číslic). Další číslo: vydané <b>${esc(tryNext(n.rady.vydane, 'vydana'))}</b>, přijaté <b>${esc(tryNext(n.rady.prijate, 'prijata'))}</b>.</p>
  <div class="grid">${fld('Vydané faktury', 'r_vydane', n.rady.vydane)}${fld('Přijaté doklady', 'r_prijate', n.rady.prijate)}</div>
  <h3>Vzhled a texty faktury</h3><div class="grid">${fld('Výchozí splatnost (dní)', 'f_splatnost', n.faktura.splatnost_dni, 'number')}${fld('Barva faktury', 'f_barva', n.faktura.barva, 'color')}
    <label class="f"><span>Logo (PNG/JPG do 150 kB)</span><input type="file" accept="image/png,image/jpeg,image/svg+xml" onchange="A.logo(this.files[0])"></label>
    <label class="f chk"><input type="checkbox" data-k="f_epc" ${n.faktura.epc_qr !== false ? 'checked' : ''}><span>SEPA QR kód na fakturách v EUR</span></label></div>
  ${n.faktura.logo ? `<div class="row"><img src="${esc(n.faktura.logo)}" style="max-height:44px" alt=""><button class="sm" onclick="A.logo(null)">Odebrat logo</button></div>` : ''}
  <div class="grid" style="margin-top:12px">${fld('Výchozí text – česky', 'f_text_cs', n.faktura.text_cs)}${fld('Výchozí text – anglicky', 'f_text_en', n.faktura.text_en)}${fld('Výchozí text – německy', 'f_text_de', n.faktura.text_de)}</div>
  <h3>Platba DPH finančnímu úřadu</h3><div class="grid">${fld('Název úřadu', 'fu_nazev', n.fu.nazev)}${fld('Účet', 'fu_ucet', n.fu.ucet)}${fld('IBAN', 'fu_iban', n.fu.iban)}${fld('BIC', 'fu_bic', n.fu.bic)}${fld('Variabilní symbol', 'fu_vs', n.fu.vs)}${fld('Zpráva pro příjemce', 'fu_zprava', n.fu.zprava)}</div>
  <div class="row"><button class="pri" onclick="A.ulozNast()">Uložit řady, fakturu a platbu DPH</button></div></div>
  <div class="card" id="s-dan"><h3>Daň z příjmů a pojistné</h3><div class="grid">${sel('Výdajový paušál', 'pausal', n.dan_prijmy.pausal, [[80, '80 %'], [60, '60 %'], [40, '40 %'], [30, '30 %']])}${fld('Titul', 'titul', o.titul)}${fld('Rodné číslo', 'rodne_cislo', o.rodne_cislo)}${fld('Datum narození', 'datum_narozeni', o.datum_narozeni, 'date')}
    ${fld('Variabilní symbol ČSSZ', 'cssz_vs', o.cssz_vs)}${fld('Kód OSSZ (např. 772)', 'cssz_ossz', o.cssz_ossz)}${fld('Měsíční nemocenské pojištění (Kč, nepovinné)', 'nemocenske', o.nemocenske)}${fld('Zdravotní pojišťovna', 'zp_nazev', o.zp_nazev)}</div>
  <h3>Parametry roku ${rok}</h3><p class="muted">Hodnoty vyhlašované každý rok. ${p.odhad ? '<b>Pro tento rok nejsou v aplikaci úřední hodnoty – doplň je.</b>' : 'Uprav jen při změně zákona.'}</p>
  <div class="grid">${fld('Hranice pro sazbu 23 %', 'hran23', p.hran23, 'number')}${fld('Sleva na poplatníka', 'sleva', p.sleva, 'number')}${fld('Min. měsíční základ – sociální', 'soc_min', p.soc_min, 'number')}${fld('Max. roční základ – sociální', 'soc_max', p.soc_max, 'number')}${fld('Min. měsíční základ – zdravotní', 'zdr_min', p.zdr_min, 'number')}${fld('Vyměřovací základ soc. (% ze základu daně)', 'soc_pct', p.soc_pct, 'number')}</div>
  <div class="row"><button class="pri" onclick="A.ulozDanNast(${rok})">Uložit daňové údaje</button></div></div>
  <div class="card" id="s-banka"><h3>Banka (Fio)</h3><p class="muted">Výpis jde vždy nahrát ručně v sekci Banka. Pro stahování jedním tlačítkem je potřeba malý prostředník, protože Fio nedovoluje webovým stránkám volat své API přímo. Prostředník si zdarma založíš ve vlastním účtu Cloudflare (Workers) vložením kódu níže; token tak prochází jen tvým vlastním účtem. Pro každý účet (CZK, EUR) si ve Fio vytvoř vlastní token s oprávněním <b>pouze ke čtení</b>. Tokeny se ukládají jen v tomto zařízení, ne na Disk.</p>
  <div class="grid">${fld('Adresa prostředníka (https://…workers.dev)', 'proxy', n.banka.proxy)}</div>
  <h3>Tokeny účtů</h3><div id="tok">${fioTokeny().concat(fioTokeny().length ? [] : [{nazev: '', token: ''}]).map((t, i) => `<div class="row tk"><input placeholder="Název účtu (např. EUR)" value="${esc(t.nazev)}" style="width:190px"><input type="password" autocomplete="off" placeholder="Fio API token (jen čtení)" value="${esc(t.token)}" style="width:330px;max-width:100%"><button class="x" title="Odebrat" onclick="this.parentNode.remove()">×</button></div>`).join('')}</div>
  <div class="row"><button class="sm" onclick="document.querySelector('#tok').insertAdjacentHTML('beforeend','<div class=&quot;row tk&quot;><input placeholder=&quot;Název účtu (např. CZK)&quot; style=&quot;width:190px&quot;><input type=&quot;password&quot; autocomplete=&quot;off&quot; placeholder=&quot;Fio API token (jen čtení)&quot; style=&quot;width:330px;max-width:100%&quot;><button class=&quot;x&quot; onclick=&quot;this.parentNode.remove()&quot;>×</button></div>')">+ další účet</button></div>
  <div class="row"><button class="pri" onclick="A.ulozBanku()">Uložit</button><button onclick="navigator.clipboard.writeText(workerKod()).then(()=>toast('Kód zkopírován.'))">Zkopírovat kód prostředníka</button></div><pre class="code">${esc(workerKod())}</pre></div>
  <div class="card" id="s-disk"><h3>Google Disk</h3><p class="muted">Data se ukládají do složky <b>_Fakturace/data</b> na tvém Google Disku. ${G.last ? 'Poslední synchronizace ' + new Date(G.last).toLocaleString('cs-CZ') + '.' : ''} ${dirty.length ? dirty.length + ' změn čeká na odeslání.' : ''}</p>
  <div class="grid">${fld('Google Client ID', 'clientId', cfg.clientId)}${fld('ID složky data (nepovinné)', 'folderId', cfg.folderId)}</div>
  <div class="row"><button class="pri" onclick="A.connect(true)">${tokenOk() ? 'Synchronizovat teď' : 'Uložit a připojit'}</button></div></div>
  <div class="card"><h3>Záloha</h3><div class="row"><button onclick="A.exportAll()">Stáhnout zálohu všech dat (JSON)</button><label class="btn">Nahrát zálohu<input type="file" accept=".json" hidden onchange="A.importAll(this.files[0])"></label></div><p class="muted">Verze aplikace 2.3</p></div>`;
};
A.ulozNast = async () => { const v = collect($('#s-nast')); try { nextNumber(v.r_vydane, today(), []); nextNumber(v.r_prijate, today(), []); } catch (e) { return toast(e.message, true); }
  await saveNast({rady: {vydane: v.r_vydane, prijate: v.r_prijate}, faktura: {splatnost_dni: parseInt(v.f_splatnost, 10) || 14, text_cs: v.f_text_cs, text_en: v.f_text_en, text_de: v.f_text_de, barva: v.f_barva, epc_qr: !!v.f_epc},
    fu: {nazev: v.fu_nazev, ucet: v.fu_ucet, iban: v.fu_iban.replace(/\s/g, ''), bic: v.fu_bic, vs: v.fu_vs, zprava: v.fu_zprava}}); toast('Nastavení uloženo.'); render(); };
A.logo = async file => { if (!file) { await saveNast({faktura: {logo: ''}}); return render(); } if (file.size > 150000) return toast('Logo je větší než 150 kB – zmenši ho.', true);
  const r = new FileReader(); r.onload = async () => { await saveNast({faktura: {logo: r.result}}); toast('Logo uloženo.'); render(); }; r.readAsDataURL(file); };
A.ulozDanNast = async rok => { const v = collect($('#s-dan')), def = Dane.PARAM[rok] || {}, par = {};
  for (const k of ['hran23', 'sleva', 'soc_min', 'soc_max', 'zdr_min', 'soc_pct']) if (v[k] !== '' && +v[k] !== def[k]) par[k] = +v[k];
  const n = JSON.parse(JSON.stringify(Store.files['nastaveni.json'] || {})); n.dan_prijmy = Object.assign({}, n.dan_prijmy || {}, {pausal: +v.pausal});
  n.osoba = {titul: v.titul, rodne_cislo: digits(v.rodne_cislo), datum_narozeni: v.datum_narozeni, cssz_vs: digits(v.cssz_vs), cssz_ossz: digits(v.cssz_ossz), nemocenske: digits(v.nemocenske), zp_nazev: v.zp_nazev};
  n.parametry = Object.assign({}, n.parametry || {}); if (Object.keys(par).length) n.parametry[rok] = par; else delete n.parametry[rok];
  await save('nastaveni.json', n); toast('Uloženo.'); render(); };
A.ulozBanku = async () => { const v = collect($('#s-banka')); if (v.proxy && !/^https:\/\//.test(v.proxy)) return toast('Adresa prostředníka musí začínat https://', true);
  cfg.fioTokens = [...document.querySelectorAll('#tok .tk')].map(r => { const i = r.querySelectorAll('input'); return {nazev: i[0].value.trim(), token: i[1].value.trim()}; }).filter(t => t.token); delete cfg.fioToken; LS.set('fak_cfg', cfg); await saveNast({banka: {proxy: v.proxy}}); toast('Uloženo.'); render(); };
A.connect = async fromForm => { try { if (fromForm) { const v = collect($('#s-disk')); cfg = Object.assign({}, cfg, {clientId: v.clientId, folderId: v.folderId}); LS.set('fak_cfg', cfg); }
  if (!tokenOk()) await gLogin(); await sync(); toast('Synchronizováno s Google Diskem.'); render(); } catch (e) { toast(e.message, true); status(); } };

/* ---------- automatická synchronizace: po otevření, po návratu do aplikace a každé 2 minuty ---------- */
let autoBezi = false;
async function autoSync(gesto) {
  if (!cfg.clientId || G.busy || autoBezi || !navigator.onLine) return; autoBezi = true;
  try { if (!tokenOk()) { if (!gesto) return; await gLogin(); }
    const pred = JSON.stringify(G.ids); await sync();
    const ae = document.activeElement, pise = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.id !== 'q';
    if (JSON.stringify(G.ids) !== pred && !/-form$/.test(cur.view) && !pise && !bank && !cenEd && !($('#ask') && $('#ask').innerHTML)) render(); else status();
  } catch (e) { status(); } finally { autoBezi = false; }
}
document.addEventListener('pointerdown', e => { if (cfg.clientId && !tokenOk() && Date.now() - G.zkus > 60000 && !/-form$/.test(cur.view) && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { G.zkus = Date.now(); autoSync(true); } }, true);
document.addEventListener('visibilitychange', () => { if (!document.hidden) autoSync(false); });
setInterval(() => { if (!document.hidden) autoSync(false); }, 120000);

/* ---------- start ---------- */
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (TOP.includes(v) && v !== cur.view && v !== 'hledat') go(v); });
window.addEventListener('DOMContentLoaded', () => {
  shell();
  try { const t = JSON.parse(sessionStorage.getItem('fak_tok') || 'null'); if (t && Date.now() < t.exp) { G.token = t.token; G.exp = t.exp; } } catch (e) {}
  const v = location.hash.slice(1); go(TOP.includes(v) && v !== 'hledat' ? v : 'prehled');
  if (tokenOk()) sync().then(render).catch(e => toast(e.message, true));
});
</script>
</body></html>
