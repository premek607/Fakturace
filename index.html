var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;

function splitVat(v) { v = String(v ?? '').replace(/\s+/g, '').toUpperCase(); return /^[A-Z]{2}/.test(v) && v.length > 2 ? [v.slice(0, 2), v.slice(2)] : ['', v]; }
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const pdate = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const lastDay = s => { const d = pdate(s); return iso(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };
const addDays = (s, n) => { const d = pdate(s); d.setDate(d.getDate() + (+n || 0)); return iso(d); };

/* ---------- evidence: mapa cesta -> JSON (stejná struktura jako data/ na Disku) ---------- */
const Store = {
  files: {},
  firma() { return this.files['firma.json'] || {}; },
  nast() {
    const n = this.files['nastaveni.json'] || {}, o = {};
    for (const k in DEF_NAST) o[k] = Object.assign({}, DEF_NAST[k], n[k] || {});
    return o;
  },
  kontakty() { return Object.keys(this.files).filter(p => p.startsWith('kontakty/')).map(p => this.files[p]).sort((a, b) => (a.nazev || '').localeCompare(b.nazev || '', 'cs')); },
  sablony() { return Object.keys(this.files).filter(p => p.startsWith('sablony/')).map(p => this.files[p]).sort((a, b) => (a.nazev || '').localeCompare(b.nazev || '', 'cs')); },
  docs() {
    const best = {};
    const put = (d, ver, path) => { if (!d || !d.cislo) return; const k = d.typ + '|' + d.cislo; if (!best[k] || ver >= best[k][0]) best[k] = [ver, d, path]; };
    const paths = Object.keys(this.files).sort();
    for (const p of paths) if (p.startsWith('import/')) for (const d of (this.files[p] || [])) put(d, -1, p);
    for (const p of paths) if (p.startsWith('vydane/') || p.startsWith('prijate/')) {
      const d = this.files[p], m = p.match(/\.v(\d+)\.json$/);
      put(d, m ? +m[1] : (+d.verze || 1), p);
    }
    return Object.values(best).map(b => Object.assign({_ver: b[0]}, b[1]));
  },
  get(cislo, typ) { return this.docs().find(d => d.cislo === cislo && (!typ || d.typ === typ)); },
  kontakt(k) {
    k = String(k || '').toLowerCase();
    return this.kontakty().find(c => [c.klic, c.ico, c.dic, c.nazev].concat(c.aliasy || []).some(n => n && String(n).toLowerCase() === k));
  },
};

/* ---------- číselné řady: tokeny RRRR, RR, MM a běh N = pořadí v roce ---------- */
function nextNumber(format, dateIso, existing) {
  const y = dateIso.slice(0, 4), m = dateIso.slice(5, 7);
  const nm = format.match(/N+/); if (!nm) throw new Error('Číselná řada musí obsahovat pořadí (NNN)');
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const build = (seq, forRe) => {
    let out = '', i = 0;
    while (i < format.length) {
      if (format.startsWith('RRRR', i)) { out += y; i += 4; }
      else if (format.startsWith('RR', i)) { out += y.slice(2); i += 2; }
      else if (format.startsWith('MM', i)) { out += forRe ? '\\d\\d' : m; i += 2; }
      else if (i === nm.index) { out += forRe ? '(\\d{' + nm[0].length + ',})' : String(seq).padStart(nm[0].length, '0'); i += nm[0].length; }
      else { out += forRe ? reEsc(format[i]) : format[i]; i++; }
    }
    return out;
  };
  const re = new RegExp('^' + build(0, true) + '$');
  let max = 0;
  for (const n of existing) { const mm = String(n).match(re); if (mm) max = Math.max(max, +mm[1]); }
  return build(max + 1, false);
}

/* ---------- výpočet položek ---------- */
function calcItems(polozky, sazbaDef, cleneniDef, kurz) {
  kurz = +kurz || 1;
  const S = {zaklad: 0, dph: 0, celkem: 0, zaklad_czk: 0, dph_czk: 0, celkem_czk: 0}, out = [];
  for (const p0 of polozky) {
    const p = Object.assign({}, p0);
    const sazba = parseInt(p.sazba ?? sazbaDef, 10) || 0, typ = p.typ_ceny || 'bez_dph';
    const qty = +(p.mnozstvi ?? 1) || 0, cena = +p.cena || 0;
    let zaklad, dph;
    if (p._pevne) { zaklad = r2(p.zaklad); dph = r2(p.dph); }
    else if (typ === 's_dph') { const c = r2(qty * cena); dph = r2(c * sazba / (100 + sazba)); zaklad = r2(c - dph); }
    else { zaklad = r2(qty * cena); dph = typ === 'bez_dph' ? r2(zaklad * sazba / 100) : 0; }
    delete p._pevne;
    Object.assign(p, {sazba, cleneni: p.cleneni ?? cleneniDef, mnozstvi: qty, typ_ceny: typ, cena, zaklad, dph, celkem: r2(zaklad + dph),
      zaklad_czk: r2(zaklad * kurz), dph_czk: r2(dph * kurz), celkem_czk: r2((zaklad + dph) * kurz)});
    for (const k in S) S[k] = r2(S[k] + p[k]);
    out.push(p);
  }
  return [out, S];
}

/* ---------- DPH: přiznání, kontrolní a souhrnné hlášení (struktura EPO, shodná s Python dph_core) ---------- */
const DPH = (() => {
  const SC = 10000, I = x => Math.round((+x || 0) * SC);
  const hu = (v, unit) => { const s = v < 0 ? -1 : 1; return s * Math.floor((Math.abs(v) + unit / 2 + 1e-6) / unit); };
  const r0 = v => hu(v, SC), f2 = v => (hu(v, SC / 100) / 100).toFixed(2);
  const RK = {1: '23', 0: '5', 3: '5'}, KHI = {1: '1', 0: '2', 3: '2'};
  const SELF = ['03-04', '05-06', '10-11', '12-13'], OUTONLY = ['20', '21', '22', '25', '26'];
  const V1 = ['dan23','dan5','dan_pzb23','dan_pzb5','dan_psl23_e','dan_psl5_e','dan_dzb23','dan_dzb5','dan_pdop_nrg','dan_rpren23','dan_rpren5','dan_psl23_z','dan_psl5_z','obrat23','obrat5','p_zb23','p_zb5','p_sl23_e','p_sl5_e','dov_zb23','dov_zb5','p_dop_nrg','rez_pren23','rez_pren5','p_sl23_z','p_sl5_z'];
  const V2 = ['dod_zb','pln_sluzby','pln_vyvoz','dod_dop_nrg','pln_zaslani','pln_rez_pren','pln_ost'];
  const V4 = ['pln23','pln5','dov_cu','nar_zdp23','nar_zdp5','nar_maj','odp_tuz23_nar','odp_tuz5_nar','odp_cu_nar','od_zdp23','od_zdp5','odp_sum_nar','od_maj','odp_tuz23','odp_tuz5','odp_cu','odp_sum_kr','odkr_maj'];
  const xesc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const dcz = s => s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4);

  function toCore(d) {
    const p = d.partner || {}; let [cc, vat] = splitVat(p.dic);
    if (!cc && vat) cc = p.stat || 'CZ';
    return {side: d.typ === 'vydana' ? 'out' : 'in', number: d.cislo, external: d.externi_cislo, partner: p.nazev, vatid: vat, cc,
      duzp: (d.duzp || d.datum_vystaveni || '').slice(0, 10), vat_date: (d.datum_uplatneni || d.duzp || '').slice(0, 10),
      total: I((d.soucty || {}).celkem_czk),
      lines: (d.polozky || []).map(q => { const s = parseInt(q.sazba, 10) || 0; return {code: q.cleneni || '', rt: RATE_TYPE[s] ?? 2, rate: s, base: I(q.zaklad_czk), vat: I(q.dph_czk)}; })};
  }

  function build(docsAll, month, profil, dPoddp) {
    const [y, m] = month.split('_').map(Number);
    const start = `${y}-${String(m).padStart(2, '0')}-01`, end = lastDay(start);
    const R = {}, add = (k, v) => { R[k] = (R[k] || 0) + v; };
    const warnings = [], listing = [], a4 = [], a2 = [], b2 = [], a5 = {}, b3 = {}, sh = {};
    for (const d0 of docsAll) {
      if (d0.storno) continue;
      const doc = toCore(d0);
      if (!(doc.vat_date >= start && doc.vat_date <= end)) continue;
      const per = {};
      for (const ln of doc.lines) {
        const code = ln.code;
        if (['', '0U', '0P'].includes(code)) continue;
        let vat = ln.vat; const base = ln.base, rt = ln.rt;
        if (SELF.includes(code)) vat = hu(base * ln.rate / 100, SC / 100) * (SC / 100);
        const rk = RK[rt];
        if (rk === undefined && !OUTONLY.includes(code)) throw new Error(`${doc.number}: neznámá sazba u členění ${code}`);
        per[code] = per[code] || {}; per[code][rt] = per[code][rt] || [0, 0];
        per[code][rt][0] += base; per[code][rt][1] += vat;
        if (code === '01-02') { add('obrat' + rk, base); add('dan' + rk, vat); }
        else if (code === '03-04') { add('p_zb' + rk, base); add('dan_pzb' + rk, vat); add('nar_zdp' + rk, base); add('od_zdp' + rk, vat); }
        else if (code === '05-06') { add('p_sl' + rk + '_e', base); add('dan_psl' + rk + '_e', vat); add('nar_zdp' + rk, base); add('od_zdp' + rk, vat); }
        else if (code === '12-13') { add('p_sl' + rk + '_z', base); add('dan_psl' + rk + '_z', vat); add('nar_zdp' + rk, base); add('od_zdp' + rk, vat); }
        else if (code === '10-11') { add('rez_pren' + rk, base); add('dan_rpren' + rk, vat); add('nar_zdp' + rk, base); add('od_zdp' + rk, vat); }
        else if (code === '40-41' || code === '40-41m') { add('pln' + rk, base); add('odp_tuz' + rk + '_nar', vat); if (code === '40-41m') { add('nar_maj', base); add('od_maj', vat); } }
        else if (code === '20') add('dod_zb', base);
        else if (code === '21') add('pln_sluzby', base);
        else if (code === '22') add('pln_vyvoz', base);
        else if (code === '25') add('pln_rez_pren', base);
        else if (code === '26') add('pln_ost', base);
        else throw new Error(`${doc.number}: členění ${code} není podporované – zpracuj ručně`);
      }
      const perKh = {};
      for (const code in per) { const kc = code === '40-41m' ? '40-41' : code; perKh[kc] = perKh[kc] || {};
        for (const k in per[code]) { perKh[kc][k] = perKh[kc][k] || [0, 0]; perKh[kc][k][0] += per[code][k][0]; perKh[kc][k][1] += per[code][k][1]; } }
      const ext = doc.external || doc.number, dppd = dcz(doc.duzp);
      for (const code in perKh) {
        const br = perKh[code], row = {br};
        const accum = tgt => { for (const k in br) { tgt[k] = tgt[k] || [0, 0]; tgt[k][0] += br[k][0]; tgt[k][1] += br[k][1]; } };
        if (code === '01-02') { if (doc.total > 10000 * SC && doc.vatid && ['CZ', ''].includes(doc.cc)) a4.push(Object.assign({c_evid_dd: doc.number, dppd, dic_odb: doc.vatid}, row)); else accum(a5); }
        else if (code === '03-04' || code === '05-06') { if (!doc.vatid || !doc.cc) warnings.push(`${doc.number}: dodavatel bez VAT ID – oddíl A.2 nelze správně vyplnit`); a2.push(Object.assign({c_evid_dd: ext, vatid_dod: doc.vatid, k_stat: doc.cc, dppd}, row)); }
        else if (code === '40-41') { if (doc.total > 10000 * SC && doc.vatid) b2.push(Object.assign({c_evid_dd: ext, dic_dod: doc.vatid, dppd}, row)); else accum(b3); }
        else if (['10-11', '12-13', '25'].includes(code)) warnings.push(`${doc.number}: členění ${code} – oddíl KH (A.1/B.1) není automatický, doplň ručně`);
        else if (code === '20' || code === '21') { const key = [doc.cc, doc.vatid, code === '20' ? '0' : '3'].join('|'); sh[key] = sh[key] || [0, 0]; for (const k in br) sh[key][0] += br[k][0]; sh[key][1] += 1; }
      }
      listing.push({side: doc.side, number: doc.number, external: doc.external, partner: doc.partner, duzp: dppd, total: doc.total / SC,
        codes: Object.fromEntries(Object.entries(per).map(([c, br]) => [c, Object.values(br).reduce((a, v) => [a[0] + v[0] / SC, a[1] + v[1] / SC], [0, 0])]))});
    }
    const Z = {}; for (const k of [...V1, ...V2, ...V4]) Z[k] = r0(R[k] || 0);
    Z.odp_sum_nar = Z.odp_tuz23_nar + Z.odp_tuz5_nar + Z.odp_cu_nar + Z.od_zdp23 + Z.od_zdp5;
    const dan = V1.filter(k => k.startsWith('dan')).reduce((s, k) => s + Z[k], 0), odp = Z.odp_sum_nar + Z.odp_sum_kr;
    const v6 = {dan_zocelk: dan, odp_zocelk: odp, dano_da: Math.max(0, dan - odp), dano_no: Math.max(0, odp - dan)};
    const tag = `${y}M${String(m).padStart(2, '0')}`;
    const el = (t, a) => `<${t} ${Object.entries(a).map(([k, v]) => `${k}="${xesc(v)}"`).join(' ')} />`;
    const pick = keys => Object.fromEntries(keys.map(k => [k, Z[k]]));
    const xml = (root, vd, body) => {
      const vp = Object.assign({}, (profil || {}).VetaP || {}); if (root === 'DPHSHV') { delete vp.c_telef; delete vp.email; }
      return `<?xml version="1.0" encoding="UTF-8"?><Pisemnost nazevSW="Claude-Fakturace" verzeSW="1.0"><${root} verzePis="01.02.01">${el('VetaD', vd)}${el('VetaP', vp)}${body.join('')}</${root}></Pisemnost>`;
    };
    const rates = br => { const o = {}; for (const i of ['1', '2', '3']) { let b = 0, t = 0; for (const k in br) if (KHI[k] === i) { b += br[k][0]; t += br[k][1]; } o['dan' + i] = b || t ? f2(t) : '0'; o['zakl_dane' + i] = b || t ? f2(b) : '0'; } return o; };
    const files = {};
    files[`DPHDP3-${tag}.xml`] = xml('DPHDP3', {k_uladis: 'DPH', d_poddp: dPoddp, rok: y, dokument: 'DP3', mesic: m, dapdph_forma: 'B', typ_platce: 'P', trans: 'A', c_okec: (profil || {}).c_okec || '620000'},
      [el('Veta1', pick(V1)), el('Veta2', pick(V2)), el('Veta3', {tri_pozb: 0, tri_dozb: 0, dov_osv: 0, opr_verit: 0, opr_dluz: 0}), el('Veta4', pick(V4)), el('Veta5', {plnosv_kf: 0}), el('Veta6', v6)]);
    const kh = [];
    for (const x of a2) kh.push(el('VetaA2', Object.assign({c_evid_dd: x.c_evid_dd, vatid_dod: x.vatid_dod}, rates(x.br), {dppd: x.dppd, k_stat: x.k_stat})));
    for (const x of a4) kh.push(el('VetaA4', Object.assign({c_evid_dd: x.c_evid_dd}, rates(x.br), {dppd: x.dppd, dic_odb: x.dic_odb, kod_rezim_pl: '0', zdph_44: 'N'})));
    if (Object.keys(a5).length) kh.push(el('VetaA5', rates(a5)));
    for (const x of b2) kh.push(el('VetaB2', Object.assign({c_evid_dd: x.c_evid_dd, dic_dod: x.dic_dod}, rates(x.br), {dppd: x.dppd, pomer: 'N', zdph_44: 'N'})));
    if (Object.keys(b3).length) kh.push(el('VetaB3', rates(b3)));
    const celkA2 = a2.reduce((s, x) => s + Object.values(x.br).reduce((q, v) => q + v[0], 0), 0);
    const vc = {celk_zd_a2: celkA2, obrat23: R.obrat23 || 0, obrat5: R.obrat5 || 0, pln23: R.pln23 || 0, pln5: R.pln5 || 0, pln_rez_pren: R.pln_rez_pren || 0, rez_pren23: R.rez_pren23 || 0, rez_pren5: R.rez_pren5 || 0};
    kh.push(el('VetaC', Object.fromEntries(Object.entries(vc).map(([k, v]) => [k, v ? f2(v) : '0']))));
    files[`DPHKH1-${tag}.xml`] = xml('DPHKH1', {k_uladis: 'DPH', d_poddp: dPoddp, rok: y, dokument: 'KH1', mesic: m, khdph_forma: 'B'}, kh);
    const shKeys = Object.keys(sh).sort();
    if (shKeys.length) files[`DPHSHV-${tag}.xml`] = xml('DPHSHV', {k_uladis: 'DPH', d_poddp: dPoddp, rok: y, dokument: 'SHV', mesic: m, shvies_forma: 'R'},
      shKeys.map(k => { const [cc, vat, kp] = k.split('|'); return el('VetaR', {c_vat: vat, k_pln_eu: kp, k_stat: cc, pln_hodnota: r0(sh[k][0]), pln_pocet: sh[k][1]}); }));
    if (!listing.some(d => d.side === 'out')) warnings.push('V měsíci není žádný vydaný doklad – je to správně?');
    return {month, tag, files, Z: Object.assign({}, Z, v6), documents: listing, warnings, sh: shKeys.length > 0};
  }
  return {build};
})();

/* ---------- daň z příjmů – podklady (výdajový paušál) ---------- */
function danPrijmy(rok, pausal) {
  const y = String(rok); let duzp = 0, zapl = 0; const neuhr = [], radky = [];
  for (const d of Store.docs()) {
    if (d.storno || d.typ !== 'vydana') continue;
    const base = +(d.soucty || {}).zaklad_czk || 0;
    if ((d.duzp || '').slice(0, 4) === y) duzp += base;
    const pl = (d.uhrady || []).filter(u => (u.datum || '').slice(0, 4) === y);
    if (pl.length) { zapl += base; radky.push({cislo: d.cislo, partner: (d.partner || {}).nazev, datum: pl[0].datum, zaklad: base}); }
    if (!(d.uhrady || []).length) neuhr.push(d);
  }
  const limit = {80: 1600000, 60: 1200000, 40: 800000, 30: 600000}[pausal] || Infinity;
  const vydaje = Math.min(Math.round(zapl * pausal / 100), limit);
  return {rok, fakturovano: r2(duzp), prijmy: r2(zapl), pausal, vydaje, zaklad: Math.max(0, Math.round(zapl) - vydaje), neuhr, radky: radky.sort((a, b) => a.datum.localeCompare(b.datum))};
}

if (typeof module !== 'undefined' && module.exports) module.exports = {Store, DPH, calcItems, nextNumber, danPrijmy, r2};
</script>
<script>/* ====== Fakturace – uživatelské rozhraní, ukládání, Google Disk ====== */
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const fmt = (x, d = 2) => (+x || 0).toLocaleString('cs-CZ', {minimumFractionDigits: d, maximumFractionDigits: d});
const kc = (x, cur) => fmt(x) + ' ' + (!cur || cur === 'CZK' ? 'Kč' : cur);
const fd = s => s ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4) : '';
const today = () => iso(new Date());
const MES = ['leden', 'únor', 'březen', 'duben', 'květen', 'červen', 'červenec', 'srpen', 'září', 'říjen', 'listopad', 'prosinec'];

/* ---------- paměť prohlížeče ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('Nepodařilo se uložit do paměti prohlížeče.', true); } },
};
let cfg = LS.get('fak_cfg', {clientId: '', folderId: ''});
Store.files = LS.get('fak_files', {});
let dirty = LS.get('fak_dirty', []);
const G = {token: null, exp: 0, ids: LS.get('fak_ids', {}), folders: {}, busy: false, last: LS.get('fak_last', null)};

function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', err ? 7000 : 3500); }
function persist() { LS.set('fak_files', Store.files); LS.set('fak_dirty', dirty); LS.set('fak_ids', G.ids); }
async function save(path, obj) {
  Store.files[path] = obj; if (!dirty.includes(path)) dirty.push(path); persist();
  if (tokenOk()) { try { await pushDirty(); } catch (e) { toast('Uloženo jen v tomto zařízení: ' + e.message, true); } }
  status();
}

/* ---------- Google Disk ---------- */
const FOLDER = 'application/vnd.google-apps.folder', API = 'https://www.googleapis.com/drive/v3/files', UP = 'https://www.googleapis.com/upload/drive/v3/files';
const tokenOk = () => G.token && Date.now() < G.exp;
function gLogin() {
  return new Promise((res, rej) => {
    if (!cfg.clientId) return rej(new Error('V Nastavení chybí Google Client ID.'));
    if (!(window.google && google.accounts && google.accounts.oauth2)) return rej(new Error('Přihlášení Google se nenačetlo (jsi online a na adrese https?).'));
    const tc = google.accounts.oauth2.initTokenClient({client_id: cfg.clientId, scope: 'https://www.googleapis.com/auth/drive',
      callback: t => { if (t.error) return rej(new Error(t.error_description || t.error)); G.token = t.access_token; G.exp = Date.now() + ((+t.expires_in || 3600) - 60) * 1000;
        try { sessionStorage.setItem('fak_tok', JSON.stringify({token: G.token, exp: G.exp})); } catch (e) {} res(); },
      error_callback: e => rej(new Error('Přihlášení se nezdařilo (' + (e.type || 'chyba') + ').'))});

async function gfetch(url, opt = {}) {
  opt.headers = Object.assign({Authorization: 'Bearer ' + G.token}, opt.headers || {});
  const r = await fetch(url, opt);
  if (r.status === 401) { G.token = null; throw new Error('Přihlášení ke Google Disku vypršelo, přihlas se znovu.'); }
  if (!r.ok) throw new Error('Google Disk ' + r.status + ': ' + (await r.text()).slice(0, 160));
  return r;
}
async function glist(q) {
  let out = [], pt = '';

  return out;
}
async function gmkdir(name, parent) { return (await (await gfetch(API + '?fields=id', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name, mimeType: FOLDER, parents: parent ? [parent] : undefined})})).json()).id; }
async function dataFolder() {
  if (cfg.folderId) return cfg.folderId;
  let f = (await glist(`name='_Fakturace' and mimeType='${FOLDER}'`))[0];
  const fid = f ? f.id : await gmkdir('_Fakturace');
  let d = (await glist(`'${fid}' in parents and name='data' and mimeType='${FOLDER}'`))[0];

}
async function ensureFolder(path) {

}
async function gput(path, obj) {
  const body = JSON.stringify(obj, null, 2), ex = G.ids[path];
  if (ex) { const j = await (await gfetch(`${UP}/${ex.id}?uploadType=media&fields=id,modifiedTime`, {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body})).json(); G.ids[path] = {id: j.id, mtime: j.modifiedTime}; return; }
  const parts = path.split('/'), name = parts.pop(), parent = await ensureFolder(parts.join('/')), b = 'fak' + Date.now();
  const mp = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name, parents: [parent], mimeType: 'application/json'})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
  const j = await (await gfetch(`${UP}?uploadType=multipart&fields=id,modifiedTime`, {method: 'POST', headers: {'Content-Type': 'multipart/related; boundary=' + b}, body: mp})).json();

async function pushDirty() {
  if (!G.folders['']) G.folders[''] = await dataFolder();

}
async function sync() {
  if (!tokenOk()) throw new Error('Nejsi přihlášen ke Google Disku.');
  if (G.busy) return; G.busy = true; status();
  try {
    const root = await dataFolder(); G.folders = {'': root}; const remote = {};
    const walk = async (id, pre) => { for (const f of await glist(`'${id}' in parents`)) { if (f.mimeType === FOLDER) { G.folders[pre + f.name] = f.id; await walk(f.id, pre + f.name + '/'); } else if (f.name.endsWith('.json')) remote[pre + f.name] = {id: f.id, mtime: f.modifiedTime}; } };
    await walk(root, '');
    const old = G.ids; G.ids = Object.assign({}, remote);
    await pushDirty();
    for (const p in remote) if (!old[p] || old[p].mtime !== remote[p].mtime || !(p in Store.files)) { if (G.ids[p].mtime === remote[p].mtime) Store.files[p] = await (await gfetch(`${API}/${remote[p].id}?alt=media`)).json(); }
    for (const p of Object.keys(Store.files)) if (!G.ids[p]) delete Store.files[p];
    G.last = new Date().toISOString(); LS.set('fak_last', G.last); persist();
  } finally { G.busy = false; status(); }
}

  const el = $('#sync'); if (!el) return;

A.ulozVydanou = async () => {

    const [cc] = splitVat(c.dic);
    if (F.rezim === 'eu_sluzba' && (!EU.includes(cc))) throw new Error('Režim „služba do EU“ vyžaduje odběratele s VAT ID státu EU.');
    if (F.rezim === 'tuzemsko' && cc && cc !== 'CZ') throw new Error('Tuzemský režim u zahraničního odběratele – zkontroluj režim DPH.');
    const kurz = F.mena === 'CZK' ? 1 : num(F.kurz); if (!kurz) throw new Error('U cizí měny vyplň kurz ČNB k DUZP.');
    const ucet = (f.ucty || {})[F.mena]; if (!ucet) throw new Error('V Nastavení chybí bankovní účet pro měnu ' + F.mena + '.');
    const old = F._old, all = Store.docs().filter(d => d.typ === 'vydana').map(d => d.cislo);

    const qr = F.mena === 'CZK' ? `SPD*1.0*ACC:${ucet.iban}+${ucet.swift}*AM:${soucty.celkem.toFixed(2)}*CC:CZK*X-VS:${digits(cislo).slice(0, 10)}*DT:${F.splatnost.replace(/-/g, '')}*MSG:Faktura ${cislo}` : null;

      partner: {nazev: c.nazev, ulice: c.ulice, mesto: c.mesto, psc: c.psc, stat: c.stat, stat_nazev: c.stat_nazev, ico: c.ico || null, dic: c.dic || null, email: c.email || null},

      polozky, soucty, ucet: {cislo: ucet.cislo, iban: ucet.iban, iban_tisk: ucet.iban_tisk || ibanTisk(ucet.iban), swift: ucet.swift}, text: F.text, text_rezim: R['text_' + F.jazyk] || null,
      objednavka: F.objednavka || null, popis: F.popis || c.nazev, qr, uhrady: old ? (old.uhrady || []) : [], dan_z_prijmu: true, zdroj: 'fakturace-web', vytvoreno: new Date().toISOString().slice(0, 19)};
    await save(`vydane/${F.datum_vystaveni.slice(0, 4)}/${cislo}${ver > 1 ? '.v' + ver : ''}.json`, d);
    F = null; toast('Faktura ' + cislo + ' uložena.'); go('vydana', cislo);
  } catch (e) { toast(e.message, true); }
};

};
function tryNext(fmtStr, typ) { try { return nextNumber(fmtStr, today(), Store.docs().filter(d => d.typ === typ).map(d => d.cislo)); } catch (e) { return 'chybný formát'; } }
A.ulozFirmu = async () => { const v = collect($('#s-firma')), f = Object.assign({}, Store.firma());
  for (const k of ['nazev', 'ulice', 'mesto', 'psc', 'ico', 'dic', 'email', 'telefon', 'konstantni_symbol']) f[k] = v[k];
  f.ucty = Object.assign({}, f.ucty); for (const [m, p] of [['CZK', 'czk'], ['EUR', 'eur']]) { if (v[p + '_iban'] || v[p + '_cislo']) f.ucty[m] = Object.assign({}, f.ucty[m], {cislo: v[p + '_cislo'], iban: v[p + '_iban'].replace(/\s/g, ''), iban_tisk: ibanTisk(v[p + '_iban']), swift: v[p + '_swift']}); }
  await save('firma.json', f); toast('Uloženo.'); render(); };
A.ulozNast = async () => { const v = collect($('#s-nast')); try { nextNumber(v.r_vydane, today(), []); nextNumber(v.r_prijate, today(), []); } catch (e) { return toast(e.message, true); }
  await save('nastaveni.json', {rady: {vydane: v.r_vydane, prijate: v.r_prijate}, faktura: {splatnost_dni: parseInt(v.f_splatnost, 10) || 14, text_cs: v.f_text_cs, text_en: v.f_text_en, barva: v.f_barva},
    fu: {nazev: v.fu_nazev, ucet: v.fu_ucet, iban: v.fu_iban.replace(/\s/g, ''), bic: v.fu_bic, vs: v.fu_vs, zprava: v.fu_zprava}, dan_prijmy: {pausal: +v.pausal}}); toast('Nastavení uloženo.'); render(); };
A.connect = async fromForm => { try { if (fromForm) { const v = collect($('#s-disk')); cfg = {clientId: v.clientId, folderId: v.folderId}; LS.set('fak_cfg', cfg); }
  if (!tokenOk()) await gLogin(); await sync(); toast('Synchronizováno s Google Diskem.'); render(); } catch (e) { toast(e.message, true); status(); } };
A.exportAll = () => download('fakturace-zaloha-' + today() + '.json', JSON.stringify(Store.files), 'application/json');
A.importAll = async file => { if (!file) return; try { const j = JSON.parse(await file.text()); if (!j || typeof j !== 'object' || Array.isArray(j)) throw 0; for (const p in j) { Store.files[p] = j[p]; if (!dirty.includes(p)) dirty.push(p); } persist(); toast('Záloha načtena (' + Object.keys(j).length + ' souborů).'); render(); } catch (e) { toast('Soubor není platná záloha.', true); } };

/* ---------- start ---------- */
const TOP = ['prehled', 'vydane', 'prijate', 'kontakty', 'sablony', 'dph', 'dan', 'nastaveni'];
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (TOP.includes(v) && v !== cur.view) go(v); });
window.addEventListener('DOMContentLoaded', () => {
  try { const t = JSON.parse(sessionStorage.getItem('fak_tok') || 'null'); if (t && Date.now() < t.exp) { G.token = t.token; G.exp = t.exp; } } catch (e) {}
  const v = location.hash.slice(1); go(TOP.includes(v) ? v : 'prehled');
  if (tokenOk()) sync().then(render).catch(e => toast(e.message, true));
});
</script>
